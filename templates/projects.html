{% extends 'base.html' %}

{% block content %}
<div class="py-4 mb-5 text-center text-md-start">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3">
        <div>
            <h1 class="display-5 fw-black text-white mb-2 text-gradient">All Projects</h1>
            <p class="text-light opacity-75 mb-0 fs-5">A complete directory of open-source contributions</p>
        </div>
        <div>
            <span class="badge bg-transparent border text-light px-3 py-2 rounded-pill fs-6 fw-normal" style="border-color: rgba(255,255,255,0.1) !important;">
                <i class="bi bi-journal-code text-info me-1"></i> {{ repos|length }} Repositories
            </span>
        </div>
    </div>
</div>

<main class="mb-5 pb-4">
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        {% for repo in repos %}
            {% include 'components/repo_card.html' %}
        {% else %}
        <div class="col-12">
            <div class="text-center py-5 rounded-4 shadow-sm" style="background-color: var(--card-bg);">
                <i class="bi bi-folder-x display-3 d-block text-muted mb-3"></i>
                <p class="fs-5 text-light opacity-75">No repositories matching the criteria.</p>
            </div>
        </div>
        {% endfor %}
    </div>
</main>
{% endblock %}
