<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of {{ user.name or user.login }}" />
    <meta property="og:title" content="{{ user.name or user.login }} | Portfolio" />
    <meta property="og:description" content="Portfolio of {{ user.name or user.login }}" />
    <title>{{ user.name or user.login }} | Portfolio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#2563eb',
                            hover: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Page load fade-in */
        body {
            animation: pageLoad 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes pageLoad {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scroll reveal animation system */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.08s; }
        .reveal-delay-2 { transition-delay: 0.16s; }
        .reveal-delay-3 { transition-delay: 0.24s; }
        .reveal-delay-4 { transition-delay: 0.32s; }
        .reveal-delay-5 { transition-delay: 0.4s; }

        /* Scale-in reveal variant */
        .reveal-scale {
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-scale.revealed {
            opacity: 1;
            transform: scale(1);
        }

        /* Slide-in from left */
        .reveal-left {
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-left.revealed {
            opacity: 1;
            transform: translateX(0);
        }

        /* Stagger children animation */
        .stagger-children > * {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stagger-children.revealed > *:nth-child(1) { transition-delay: 0.04s; }
        .stagger-children.revealed > *:nth-child(2) { transition-delay: 0.08s; }
        .stagger-children.revealed > *:nth-child(3) { transition-delay: 0.12s; }
        .stagger-children.revealed > *:nth-child(4) { transition-delay: 0.16s; }
        .stagger-children.revealed > *:nth-child(5) { transition-delay: 0.2s; }
        .stagger-children.revealed > *:nth-child(6) { transition-delay: 0.24s; }
        .stagger-children.revealed > *:nth-child(7) { transition-delay: 0.28s; }
        .stagger-children.revealed > *:nth-child(8) { transition-delay: 0.32s; }
        .stagger-children.revealed > * {
            opacity: 1;
            transform: translateY(0);
        }

        /* Focus states */
        a:focus-visible,
        button:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* Button press effect */
        .btn-press:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
        }

        /* Navbar scroll transition */
        .nav-scrolled {
            background-color: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.08) !important;
            border-color: rgba(229, 231, 235, 0.8) !important;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .reveal, .reveal-scale, .reveal-left, .stagger-children > * {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
            }
            body { animation: none !important; }
            html { scroll-behavior: auto !important; }
        }

        /* Line clamp */
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-white text-gray-600 antialiased">
    <!-- Skip to content -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:bg-primary focus:text-white focus:px-4 focus:py-2 focus:rounded-lg focus:text-sm">
        Skip to main content
    </a>

    <!-- Floating Navigation -->
    <nav id="main-nav" class="fixed top-4 left-4 right-4 z-50 bg-white/80 backdrop-blur-xl border border-gray-200/60 rounded-2xl shadow-lg shadow-gray-900/5 transition-all duration-500 ease-out" aria-label="Main navigation">
        <div class="max-w-5xl mx-auto px-5 h-14 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-gray-900 font-semibold text-base hover:text-primary transition-colors duration-200 btn-press" aria-label="Home">
                <svg class="w-5 h-5 text-primary transition-transform duration-300 hover:rotate-12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4m0 0l1 12M5 8l4 4m0 0l-1 12"></path>
                </svg>
                {{ user.name or user.login }}
            </a>
            <div class="flex items-center gap-1">
                <a href="index.html" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-xl hover:bg-gray-100/80 transition-all duration-200 btn-press">Home</a>
                <a href="projects.html" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-xl hover:bg-gray-100/80 transition-all duration-200 btn-press">Projects</a>
                <a href="{{ user.html_url }}" target="_blank" rel="noopener noreferrer" class="ml-2 px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-xl hover:bg-gray-800 transition-all duration-200 hover:shadow-md hover:shadow-gray-900/20 btn-press" aria-label="Visit GitHub profile">
                    GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 pt-24 pb-12 lg:pt-28 lg:pb-16" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="reveal border-t border-gray-100" role="contentinfo">
        <div class="max-w-5xl mx-auto px-6 py-8 text-center text-sm text-gray-400">
            <p>Generated with GitHub Portfolio Auto-Generator &copy; {{ now.year if now else '2024' }}</p>
        </div>
    </footer>

    <!-- Scroll Reveal + Navbar Observer -->
    <script>
        (function() {
            const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReduced) {
                document.querySelectorAll('.reveal, .reveal-scale, .reveal-left, .stagger-children').forEach(el => {
                    el.classList.add('revealed');
                });
                return;
            }

            // Scroll reveal observer
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

            document.querySelectorAll('.reveal, .reveal-scale, .reveal-left, .stagger-children').forEach(el => {
                revealObserver.observe(el);
            });

            // Navbar scroll effect
            const nav = document.getElementById('main-nav');
            let lastScroll = 0;
            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                if (scrollY > 60) {
                    nav.classList.add('nav-scrolled');
                } else {
                    nav.classList.remove('nav-scrolled');
                }
                lastScroll = scrollY;
            }, { passive: true });
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
